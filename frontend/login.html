<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống Sân Bóng</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-card">
    <h2>⚽ ĐĂNG NHẬP</h2>
    <div id="err-msg"></div>
    <form id="form-login">
        <div class="form-group">
            <label>Số điện thoại:</label>
            <input type="text" id="so_dien_thoai" placeholder="Nhập số điện thoại của bạn" required>
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="mat_khau" placeholder="Nhập mật khẩu" required>
        </div>
        <button type="submit" class="btn-login">Đăng Nhập</button>
    </form>
    <div class="switch-page">
        Bạn chưa có tài khoản? <a href="register.html">Đăng ký tài khoản mới</a>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
