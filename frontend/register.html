<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản Sân Bóng</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

<div class="register-card">
    <h2>⚽ ĐĂNG KÝ TÀI KHOẢN</h2>
    <div id="thong-bao"></div>
    <form id="form-register">
        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" id="ten" placeholder="Ví dụ: Nguyễn Văn A" required>
        </div>
        <div class="form-group">
            <label>Số điện thoại:</label>
            <input type="text" id="so_dien_thoai" placeholder="Ví dụ: 0912345678" required>
        </div>
        <div class="form-group">
            <label>Email (Không bắt buộc):</label>
            <input type="email" id="email" placeholder="Ví dụ: vana@gmail.com">
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="mat_khau" placeholder="Nhập mật khẩu bảo mật" required>
        </div>
        <button type="submit" class="btn-register">Đăng Ký Ngay</button>
    </form>
    <div class="switch-page">
        Bạn đã có tài khoản rồi? <a href="login.html">Đăng nhập tại đây</a>
    </div>
</div>

<script src="js/register.js"></script>
</body>
</html>
